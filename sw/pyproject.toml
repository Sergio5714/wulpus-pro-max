[project]
name = "sw"
version = "0.2.0"
requires-python = ">=3.9"
dependencies = [
    "ipympl==0.9.2",
    "jupyter==1.0.0",
    "matplotlib==3.5.2",
    "matplotlib-inline==0.1.6",
    "numpy==1.23.5",
    "pyserial==3.5",
    "scipy==1.9.3",
    "zeroconf==0.146.5",
]

[tool.ruff]
exclude = ["wulpus/config_package.py", "wulpus/config_package_pro.py"]

[dependency-groups]
dev = [
    "clang-format==20.1.8",
]
flash = [
    "esptool>=4.8,<5",
]
