[project]
name = "sw"
version = "0.3.0"
requires-python = ">=3.9"
dependencies = [
    "ipympl==0.9.2",
    "jupyter==1.0.0",
    "matplotlib==3.5.2",
    "matplotlib-inline==0.1.6",
    "numpy==1.23.5",
    "pyserial==3.5",
    "scipy==1.9.3",
    "zeroconf==0.146.5",
]

[tool.ruff]
exclude = ["wulpus/config_package.py", "wulpus/config_package_pro.py"]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "clang-format==20.1.8",
    "ruff==0.11.13",
]
desktop = [
    "pyinstaller>=6.16,<7",
    "pyqtgraph==0.13.7",
    "pyside6>=6.5,<7",
]
flash = [
    "esptool>=4.8,<5",
]
