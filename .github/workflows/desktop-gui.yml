name: Desktop GUI
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    paths: ['sw/**', 'scripts/*desktop_gui.py', '.github/workflows/desktop-gui.yml']
  pull_request:
    paths: ['sw/**', 'scripts/*desktop_gui.py', '.github/workflows/desktop-gui.yml']
jobs:
  check:
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.9'
      - run: uv sync --locked --project sw --group desktop --group flash --group dev
      - run: uv run --locked --project sw --group dev python scripts/format_desktop_gui.py --check
      - run: uv run --locked --group desktop --group flash python -m unittest discover -s desktop_gui/tests -v
        working-directory: sw
  windows-executable:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.9'
      - run: uv sync --locked --project sw --group desktop --group flash
      - run: uv run --locked --project sw --group desktop --group flash python scripts/package_desktop_gui_release.py
      - name: Smoke-test Windows executable
        shell: pwsh
        run: |
          $executable = Get-ChildItem releases/WULPUS-Pro-Max-*.exe | Select-Object -First 1
          & $executable.FullName --smoke-test
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v4
        with:
          name: WULPUS-Pro-Max-windows-amd64
          path: |
            releases/WULPUS-Pro-Max-*.exe
            releases/WULPUS-Pro-Max-*.exe.sha256
          if-no-files-found: error
  ubuntu-executable:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.9'
      - run: uv sync --locked --project sw --group desktop --group flash
      - run: uv run --locked --project sw --group desktop --group flash python scripts/package_desktop_gui_release.py
      - run: releases/WULPUS-Pro-Max-*-ubuntu-amd64 --smoke-test
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v4
        with:
          name: WULPUS-Pro-Max-ubuntu-amd64
          path: |
            releases/WULPUS-Pro-Max-*-ubuntu-amd64
            releases/WULPUS-Pro-Max-*-ubuntu-amd64.sha256
          if-no-files-found: error
